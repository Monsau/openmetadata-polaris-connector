version: '3.8'

services:
  polaris:
    image: apache/polaris:latest
    container_name: polaris-catalog
    ports:
      - "8181:8181"  # Polaris REST API port
      - "8182:8182"  # Polaris management port
    environment:
      # Use configuration file for proper setup
      - JAVA_OPTS_APPEND=-Dquarkus.config.locations=/deployment/config/application.properties
    
    volumes:
      - ./docker/polaris/conf:/deployment/config:ro
      - polaris_data:/opt/polaris/data
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8182/q/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    
    networks:
      - polaris-network

  # Optional: PostgreSQL for persistent metadata storage
  postgres:
    image: postgres:15
    container_name: polaris-postgres
    environment:
      - POSTGRES_DB=polaris
      - POSTGRES_USER=polaris
      - POSTGRES_PASSWORD=polaris123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - polaris-network

volumes:
  polaris_data:
    driver: local
  postgres_data:
    driver: local

networks:
  polaris-network:
    driver: bridge
source:
  type: iceberg
  serviceName: apache-polaris-catalog
  serviceConnection:
    config:
      type: Iceberg
      hostPort: http://localhost:8181
      # Apache Polaris Iceberg REST Catalog Configuration
      catalog: polaris
      warehouse: s3://polaris-warehouse/
      connectionArguments:
        catalog-impl: org.apache.polaris.catalog.PolarisHadoopCatalog
        warehouse: /tmp/polaris-warehouse
        uri: http://localhost:8181
        credential: polaris:polaris-realm
      # Polaris-specific metadata extraction settings
      supportsMetadataExtraction: true
      supportsLineage: true
      supportsDBTExtraction: false
      supportsProfiler: true
      supportsUsageExtraction: false
  sourceConfig:
    config:
      type: DatabaseMetadata
      # Enhanced metadata extraction for Apache Polaris
      markDeletedTables: true
      includeTables: true
      includeViews: true
      includeTags: true
      includeOwners: true
      includeStoredProcedures: false
      includeViewLineage: true
      includeViewColumnLineage: true
      includeTableLineage: true
      # Dynamic discovery - no filters to allow all schemas and tables
      # This enables Polaris to dynamically discover any new catalogs, schemas, and tables


# Apache Polaris Configuration for Read-Only Demo Mode
# Minimal configuration

# ================================
# CORE POLARIS SETTINGS
# ================================

# Persistence - Use in-memory for demo
polaris.persistence.type=in-memory

# Realm configuration
polaris.realm-context.type=default
polaris.realm-context.realms=POLARIS

# ================================
# AUTHENTICATION - MINIMAL
# ================================

# Use default authentication
polaris.authentication.authenticator.type=default
polaris.authentication.token-service.type=default
polaris.authentication.token-broker.type=symmetric-key
polaris.authentication.token-broker.symmetric-key.secret=demo-secret

# ================================
# QUARKUS HTTP CONFIGURATION
# ================================

# HTTP port
quarkus.http.port=8181

# CORS - Allow all for demo
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=*

# ================================
# MANAGEMENT SERVER
# ================================

# Enable management endpoints
quarkus.management.enabled=true
quarkus.management.port=8182

# ================================
# LOGGING
# ================================

# Basic logging
quarkus.log.level=INFO
quarkus.log.console.enable=true

# ================================
# TELEMETRY - DISABLED
# ================================

# Disable OpenTelemetry
quarkus.otel.sdk.disabled=true
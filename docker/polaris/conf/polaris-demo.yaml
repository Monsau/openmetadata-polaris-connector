# Polaris Configuration - READ-ONLY DEMO MODE (No Authentication)
polaris:
  host: 0.0.0.0
  port: 8181

# NO AUTHENTICATION - Anonymous access for read-only demo
auth:
  type: none

# Metastore Configuration - In-memory for demo
metastore:
  type: memory

# CORS Configuration - Allow all for demo
cors:
  enabled: true
  allowed-origins:
    - "*"
  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allowed-headers:
    - "*"
  allow-credentials: false

# Default catalog configuration
default-realm: demo-realm

# Logging configuration
logging:
  level:
    org.apache.polaris: DEBUG
    root: INFO

# Anonymous access configuration
anonymous:
  enabled: true
  allow-list-operations: true
  allow-read-operations: true
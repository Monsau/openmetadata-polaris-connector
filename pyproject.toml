[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openmetadata-polaris-connector"
version = "2.0.0"
description = "Apache Polaris connector for OpenMetadata"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Mustapha Fonsau", email = "mfonsau@talentys.eu"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "openmetadata-ingestion>=1.4.0",
    "requests>=2.28.0",
    "urllib3>=1.26.0",
]

[project.urls]
Homepage = "https://github.com/Monsau/openmetadata-polaris-connector"
Repository = "https://github.com/Monsau/openmetadata-polaris-connector.git"
Issues = "https://github.com/Monsau/openmetadata-polaris-connector/issues"

[project.entry-points."openmetadata.ingestion.source.plugins"]
polaris = "polaris_connector.polaris_source:PolarisSource"

[tool.setuptools]
packages = ["polaris_connector", "polaris_connector.core"]

[tool.setuptools.package-data]
polaris_connector = ["manifest.json"]
